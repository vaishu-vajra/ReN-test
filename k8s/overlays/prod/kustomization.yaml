apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - celery-hpa.yaml   # prod-only: HPA (min 3 / max 6). Kept out of base so dev stays at replicas 1.

namespace: prod

# Kustomize creates the configmap with a hash (e.g., app-config-b9fg82cfk8)
configMapGenerator:
  - name: app-config
    literals:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=False
      # Threads per Celery task. Effective Chromium/LibreOffice concurrency per
      # pod = (--concurrency=4) x DOWNLOAD_WORKERS. 2 -> 8 concurrent renders,
      # a safe fit for an e2-standard-4 (4 vCPU / ~12Gi). Tune without a redeploy.
      - DOWNLOAD_WORKERS=2
      - MAX_DOCS_PER_TASK=20
      # Citation links in generated analysis point at this front end.
      # Not a secret: it is the public address of the web app.
      - REN_APP_BASE_URL=https://app.myrenx.ai
      # Longest highlight put in a citation link, and the safety valve for a
      # citation token the model never closes. Defaults live in
      # utils/citations.py; set here so they can be tuned without a redeploy.
      - CITATION_MAX_QUOTE_CHARS=1200
      - CITATION_MAX_HELD_CHARS=4000
      # REQUIRED before unsuspending the bulk-analysis CronJob: the DataX uid
      # the nightly run acts as. Left unset on purpose — the job exits
      # immediately rather than running against a guessed identity.
      # - BULK_ANALYSIS_UID=<uid>

# This replaces your old "kubectl create secret" command
secretGenerator:
  - name: app-secrets
    envs:
      - .env  # This looks for the .env file inside the 'prod' folder
    type: Opaque
  - name: django-secret
    literals:
      - DJANGO_SECRET_KEY=django-insecure-5h$&v0o+vepx94p5b(86c61&7b$fq_x!qt+tko(=mjmza41s%u
    type: Opaque

patches:
  - path: patch-replicas-web.yaml
  # NOTE: HPA (celery-hpa.yaml) now owns celery replicas (min 3 / max 6).
  # patch-replicas-celery.yaml still pins replicas: 3 == HPA minReplicas, so on
  # a redeploy replicas briefly resets to 3 then HPA scales back within ~60s.
  # To avoid that flap entirely, remove the line below and delete the file.
  - path: patch-replicas-celery.yaml
  - path: patch-resources-celery.yaml
  - path: patch-env-secrets-web.yaml
  - path: patch-env-secrets-celery.yaml
  - path: patch-ingress.yaml
  - path: patch-toleration-celery.yaml  
  - path: patch-toleration-web.yaml
  - path: patch-toleration-redis.yaml
  - path: patch-toleration-bulk-analysis.yaml
  - target:
      kind: ManagedCertificate
      name: web-cert
    patch: |-
      - op: replace
        path: /spec/domains/0
        value: ingestion-engine.myrenx.ai