# k8s/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"

---
apiVersion: v1
kind: Secret
metadata:
  name: django-secret
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "<your-secret-key>"
