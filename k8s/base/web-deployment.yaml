# k8s/web-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: ingestion-engine-ksa
      nodeSelector:                      # <<< ADD THIS
        cloud.google.com/gke-nodepool: wi-pool-storage
      containers:
        - name: web
          image: europe-west1-docker.pkg.dev/my-renx-ai/data-ingestion-engine-repo/web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: django-secret
            - secretRef:
                name: app-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: web
  annotations:
    cloud.google.com/backend-config: '{"default": "web-backend-config"}'
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
