# k8s/web-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress
  annotations:
    # link our ManagedCertificate
    networking.gke.io/managed-certificates: web-cert
    networking.gke.io/v1beta1: web-frontend-config
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - host: ingestion-engine.myrenx.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
